<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptops</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="min-h-screen bg-[var(--page-bg)] text-[var(--page-text)]">
    <header id="header"></header>

    <main class="mx-auto max-w-6xl px-4 py-8">
        <h1 class="mb-6 text-3xl font-bold">Browse Laptops</h1>

        <div class="mb-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <input id="search" class="field" placeholder="Search name or brand">

            <select id="category" class="field">
                <option value="">All Categories</option>
                <option value="ultrabook">Ultrabook</option>
                <option value="gaming">Gaming</option>
                <option value="2-in-1">2-in-1</option>
                <option value="creator">Creator</option>
                <option value="budget">Budget</option>
            </select>

            <input id="maxPrice" type="number" class="field" placeholder="Maximum Price">

            <input id="minRam" type="number" class="field" placeholder="Minimum RAM (GB)">

            <select id="sort" class="field">
                <option value="">Default Sorting</option>
                <option value="priceAsc">Price: Low to High</option>
                <option value="priceDesc">Price: High to Low</option>
                <option value="batteryAsc">Battery: Low to High</option>
                <option value="batteryDesc">Battery: High to Low</option>
                <option value="weightAsc">Weight: Low to High</option>
                <option value="weightDesc">Weight: High to Low</option>
            </select>
        </div>

        <p id="count" class="mb-4"></p>
        <div id="laptopList" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script type="module" src="src/js/laptops.js"></script>
</body>

</html>
