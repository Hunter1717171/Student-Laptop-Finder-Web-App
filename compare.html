<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Laptops</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="min-h-screen bg-[var(--page-bg)] text-[var(--page-text)]">
    <header id="header"></header>

    <main class="mx-auto max-w-6xl px-4 py-8">
        <h1 class="mb-3 text-3xl font-bold">Compare Laptops</h1>
        <p class="mb-5">Choose 2 to 4 laptops from your favorites.</p>

        <div id="choices" class="mb-6 grid gap-3 sm:grid-cols-2"></div>

        <p id="message" class="mb-4"></p>

        <div class="overflow-x-auto">
            <div id="comparison"></div>
        </div>
    </main>

    <script type="module" src="src/js/compare.js"></script>
</body>

</html>
